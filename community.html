<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>NowPro — Community</title>
<style>
:root{
  --bg:#f6f8fc;--card:#ffffff;--soft:#eef2f7;--text:#111827;--muted:#64748b;
  --line:#e2e8f0;--p:#4f46e5;--p2:#7c3aed;--good:#10b981;--bad:#ef4444;
  --shadow:0 8px 24px rgba(15,23,42,.055);
  --app-max:680px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
html.dark,body.dark{
  --bg:#0b1020;--card:#111827;--soft:#182235;--text:#f8fafc;--muted:#94a3b8;
  --line:#263449;--p:#4f46e5;--p2:#7c3aed;--good:#10b981;--bad:#ef4444;
  --shadow:0 8px 25px rgba(0,0,0,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);
  transition:background-color .22s ease,color .22s ease,border-color .22s ease;
}
html{color-scheme:light}
html.dark{color-scheme:dark}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{
  width:min(100%,100%);margin:auto;
  padding:10px 14px calc(74px + env(safe-area-inset-bottom));
}
.hidden{display:none!important}

/* COMMUNITY HOME / GROUP LIST */
.integrated-demo-note{
  font-size:12px;line-height:1.5;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;color:var(--muted);
  background:var(--card);margin-bottom:10px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:12px 2px 10px;
}
.section-title{font-size:14px;font-weight:850}
.count{font-size:10.5px;font-weight:750;color:var(--muted);background:var(--soft);padding:5px 10px;border-radius:999px;border:1px solid var(--line)}

.groups{display:grid;gap:10px}
@media(min-width:700px){.groups{grid-template-columns:1fr 1fr}}
.group{
  position:relative;isolation:isolate;overflow:hidden;
  width:100%;min-width:0;display:flex;align-items:center;gap:12px;padding:14px;
  text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 96%,var(--p) 4%),var(--card));
  color:var(--text);border:1px solid color-mix(in srgb,var(--line) 82%,var(--p) 18%);
  border-radius:19px;box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.group::before{
  content:"";position:absolute;z-index:-1;right:-25px;top:-34px;width:92px;height:92px;border-radius:50%;
  background:color-mix(in srgb,var(--p) 7%,transparent);pointer-events:none
}
.group:nth-child(4n+1){border-color:color-mix(in srgb,var(--line) 58%,#477dff 42%);background:linear-gradient(135deg,color-mix(in srgb,var(--card) 93%,#477dff 7%),var(--card));}
.group:nth-child(4n+2){border-color:color-mix(in srgb,var(--line) 58%,#8b5cf6 42%);background:linear-gradient(135deg,color-mix(in srgb,var(--card) 93%,#8b5cf6 7%),var(--card));}
.group:nth-child(4n+3){border-color:color-mix(in srgb,var(--line) 62%,#14b8a6 38%);background:linear-gradient(135deg,color-mix(in srgb,var(--card) 94%,#14b8a6 6%),var(--card));}
.group:nth-child(4n){border-color:color-mix(in srgb,var(--line) 60%,#f59e0b 40%);background:linear-gradient(135deg,color-mix(in srgb,var(--card) 94%,#f59e0b 6%),var(--card));}
.group:nth-child(4n+1) .group-arrow{color:#6d8cff;border-color:color-mix(in srgb,var(--line) 55%,#477dff 45%)}
.group:nth-child(4n+2) .group-arrow{color:#a78bfa;border-color:color-mix(in srgb,var(--line) 55%,#8b5cf6 45%)}
.group:nth-child(4n+3) .group-arrow{color:#2dd4bf;border-color:color-mix(in srgb,var(--line) 55%,#14b8a6 45%)}
.group:nth-child(4n) .group-arrow{color:#fbbf24;border-color:color-mix(in srgb,var(--line) 55%,#f59e0b 45%)}
.group:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.group:active{transform:scale(.992)}
.group-icon{
  width:48px;height:48px;flex:0 0 48px;border-radius:14px;
  background:linear-gradient(135deg,rgba(99,102,241,0.18),rgba(139,92,246,0.18));
  border:1px solid rgba(99,102,241,0.32);
  display:grid;place-items:center;font-size:22px;position:relative;
}
.group-info{min-width:0;flex:1}
.group-name{font-size:15px;font-weight:850;line-height:1.3;overflow-wrap:anywhere}
.members{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.group-arrow{
  width:32px;height:32px;flex:0 0 32px;border-radius:11px;
  display:grid;place-items:center;color:var(--p);background:color-mix(in srgb,var(--soft) 86%,var(--p) 14%);
  border:1px solid color-mix(in srgb,var(--line) 80%,var(--p) 20%);font-size:19px;
}
.empty{
  text-align:center;padding:30px 15px;border:1px dashed var(--line);
  border-radius:18px;color:var(--muted);font-size:12px;
}

/* =====================================================================
   AI QUESTION ANSWER STYLE CHAT INTERFACE FOR COMMUNITY GROUP CHAT
   Matches screenshot 207815.jpg (rectangular rounded-corner cards & bar)
   ===================================================================== */
body.in-chat{
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
body.in-chat .app{
  padding:0!important;
  height:100dvh!important;
  max-height:100dvh!important;
}
body.in-chat #chatPage{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  max-width:680px!important;
  margin:0 auto!important;
  height:100dvh!important;
  max-height:100dvh!important;
  display:flex!important;
  flex-direction:column!important;
  background:var(--card)!important;
  overflow:hidden!important;
  z-index:20!important;
}

/* Hide legacy extra top bar in chat so header is identical to AI Question Answer */
#chatPage > .top{
  display:none!important;
}

/* AI-Style Top Header */
.chat-head{
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:10px!important;
  padding:12px 16px!important;
  background:color-mix(in srgb,var(--card) 88%,var(--soft))!important;
  border-bottom:1px solid var(--line)!important;
  flex-shrink:0!important;
  z-index:30!important;
}
.chat-head-left{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  flex:1 1 auto;
}
.chat-group-icon-wrap{
  position:relative;
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,rgba(99,102,241,0.22),rgba(139,92,246,0.22));
  border:1px solid rgba(99,102,241,0.35);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex-shrink:0;
}
.chat-group-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}
.chat-online-dot{
  position:absolute;
  bottom:-2px;
  right:-2px;
  width:10px;
  height:10px;
  background:#10b981;
  border:2px solid var(--card);
  border-radius:50%;
  box-shadow:0 0 6px #10b981;
}
.chat-title{
  display:flex;
  flex-direction:column;
  min-width:0;
  flex:1 1 auto;
}
.chat-name{
  font-size:15.5px;
  font-weight:850;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chat-subtitle-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:3px;
  flex-wrap:wrap;
}
.chat-badge-pill{
  display:inline-block;
  padding:1px 7px;
  border-radius:6px;
  background:color-mix(in srgb,var(--p) 14%,transparent);
  color:var(--p);
  font-weight:800;
  font-size:10px;
  border:1px solid color-mix(in srgb,var(--p) 25%,transparent);
  white-space:nowrap;
}
.chat-status-live{
  color:#10b981;
  font-weight:800;
  font-size:10.5px;
  white-space:nowrap;
}
.chat-head-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.group-join-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:6px 11px;
  border-radius:10px;
  font-size:11.5px;
  font-weight:800;
  background:var(--soft);
  border:1px solid var(--line);
  color:var(--p);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.group-join-btn:hover,.group-join-btn:active{
  background:color-mix(in srgb,var(--line) 40%,var(--soft));
  border-color:var(--p);
}
.group-join-btn.joined{
  background:var(--soft);
  color:var(--muted);
}
.group-join-btn.leave{
  color:#ef4444;
  border-color:color-mix(in srgb,#ef4444 35%,var(--line));
}
.chat-close-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--muted);
  font-size:15px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s;
  flex-shrink:0;
}
.chat-close-btn:hover,.chat-close-btn:active{
  background:color-mix(in srgb,#ef4444 15%,var(--soft));
  color:#ef4444;
  border-color:#ef4444;
}

/* Scrollable Chat Messages Stream (Matches .ai-body & .ai-thread) */
.chat-messages{
  flex:1 1 auto!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  padding:16px!important;
  padding-bottom:96px!important;
  display:flex!important;
  flex-direction:column!important;
  gap:13px!important;
  scroll-behavior:smooth!important;
  overscroll-behavior:contain!important;
  -webkit-overflow-scrolling:touch!important;
  background:var(--card)!important;
}

@keyframes aiMsgFadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* Incoming / Member / Admin Message Card — Rectangular Rounded-Corner UI (Screenshot 207815.jpg) */
.msg{
  display:flex;
  flex-direction:column;
  align-self:flex-start;
  width:min(100%,520px);
  max-width:92%;
  background:var(--soft);
  border:1.5px dashed color-mix(in srgb,var(--p) 48%,var(--line));
  color:var(--text);
  border-radius:18px 18px 18px 4px!important;
  padding:11px 14px;
  font-size:13.5px;
  line-height:1.55;
  word-break:break-word;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
  animation:aiMsgFadeIn .22s ease-out;
}
.msg.admin-msg{
  border:1.5px dashed color-mix(in srgb,var(--p) 65%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--p) 7%,var(--soft)),var(--soft));
}
.msg-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
  font-size:11.5px;
  font-weight:850;
  color:var(--p);
}
.msg-sender-wrap{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-width:0;
  flex-wrap:wrap;
}
.msg-mini-avatar{
  width:20px;
  height:20px;
  border-radius:6px;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  font-size:10.5px;
  font-weight:900;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.msg-sender-name{
  font-weight:850;
  color:var(--p);
}
.msg-role-pill{
  display:inline-block;
  padding:1px 7px;
  border-radius:6px;
  background:color-mix(in srgb,var(--p) 14%,transparent);
  color:var(--p);
  font-weight:800;
  font-size:10px;
  border:1px solid color-mix(in srgb,var(--p) 25%,transparent);
}
.msg-role-pill.admin{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  border-color:transparent;
}
.msg-head-time{
  font-size:10.5px;
  font-weight:600;
  opacity:.85;
  color:var(--muted);
  white-space:nowrap;
}
/* Inner Rounded Pill Box inside the rectangular card (matches circled box in 207815.jpg) */
.msg-inner-box{
  display:block;
  width:100%;
  padding:8px 12px;
  background:color-mix(in srgb,var(--p) 8%,var(--card));
  border-radius:12px;
  border:1px solid color-mix(in srgb,var(--p) 20%,transparent);
  color:var(--text);
  font-size:13.5px;
  line-height:1.5;
}

/* User's Own Message Bubble — Right-Aligned Purple Rounded Rectangle (Matches "તમે / Hi" in 207815.jpg) */
.msg.mine{
  align-self:flex-end!important;
  width:auto!important;
  max-width:86%!important;
  min-width:68px;
  background:linear-gradient(135deg,var(--p),var(--p2))!important;
  border:0!important;
  color:#fff!important;
  border-radius:18px 18px 4px 18px!important;
  padding:10px 14px!important;
  font-size:13.5px!important;
  line-height:1.5!important;
  box-shadow:0 4px 14px rgba(99,102,241,0.25)!important;
}
.msg.mine .chat-role{
  font-size:10px;
  font-weight:850;
  opacity:.84;
  margin-bottom:3px;
  text-align:right;
  text-transform:uppercase;
  color:#fff;
}
.msg.mine .text{
  font-size:13.5px;
  line-height:1.5;
  color:#fff;
  text-align:left;
}
.msg.mine .time{
  font-size:9.5px;
  color:rgba(255,255,255,.76);
  text-align:right;
  margin-top:4px;
}

/* Practice Result Card inside Chat — Styled in the same Rectangular Rounded-Corner Card */
.practice-wrap{
  display:flex;
  flex-direction:column;
  align-self:flex-start;
  width:min(100%,520px);
  max-width:92%;
  background:var(--soft);
  border:1.5px dashed color-mix(in srgb,var(--p) 48%,var(--line));
  border-radius:18px 18px 18px 4px;
  padding:11px 14px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
  animation:aiMsgFadeIn .22s ease-out;
}
.practice{
  width:100%;
  padding:10px 12px;
  background:color-mix(in srgb,var(--p) 8%,var(--card));
  border:1px solid color-mix(in srgb,var(--p) 20%,transparent);
  border-radius:12px;
}
.practice-title{font-size:14.5px;font-weight:850;color:var(--text);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{text-align:center;padding:7px 4px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.stat b{display:block;font-size:15px;line-height:1.1;color:var(--p)}
.stat span{display:block;font-size:9px;color:var(--muted);margin-top:3px;font-weight:700}

/* AI-Style Bottom Composer Bar (Matches bottom bar of 207815.jpg) */
.chat-composer{
  position:fixed!important;
  left:50%!important;
  transform:translateX(-50%)!important;
  bottom:0!important;
  width:min(100%,680px)!important;
  z-index:100!important;
  display:flex!important;
  flex-direction:column!important;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))!important;
  background:color-mix(in srgb,var(--card) 92%,var(--soft))!important;
  border-top:1px solid var(--line)!important;
  flex-shrink:0!important;
}
body.in-chat.cb-keyboard-open .chat-composer{
  bottom:var(--cb-keyboard-offset,0px)!important;
}
.ai-composer-bar{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:4px 7px 4px 12px;
  transition:border-color .2s,box-shadow .2s;
}
.ai-composer-bar:focus-within{
  border-color:var(--p);
  box-shadow:0 0 0 3px rgba(99,102,241,0.14);
}
.composer-box{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
}
.composer-input{
  width:100%;
  height:34px;
  border:0!important;
  outline:none!important;
  background:transparent!important;
  color:var(--text)!important;
  padding:4px 44px 4px 2px!important;
  font-size:14px!important;
  line-height:1.45!important;
  box-shadow:none!important;
}
.composer-count{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:9.5px;
  font-weight:700;
  pointer-events:none;
}
.send-btn{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:11px;
  border:0;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:800;
  box-shadow:0 3px 10px rgba(99,102,241,0.32);
  transition:all .18s;
}
.send-btn:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 5px 14px rgba(99,102,241,0.42);
}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.ai-composer-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  width:100%;
  margin-top:6px;
  padding:0 4px;
  font-size:10.5px;
  color:var(--muted);
}
.integrated-chat-demo{
  font-size:10.5px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1 1 auto;
}
.ai-secure-tag{
  font-size:10.5px;
  color:var(--muted);
  flex-shrink:0;
}

/* GUEST BAR (Home Screen only) */
.guest{
  position:fixed;left:50%;bottom:0;z-index:30;transform:translateX(-50%);
  width:min(100%,100%);min-height:56px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));
  display:grid;place-items:center;text-align:center;
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  border-top:1px solid var(--line);backdrop-filter:blur(12px);
  color:var(--muted);font-size:12px;
}
.guest button{border:0;background:none;color:inherit}

/* LOGIN MODAL / PAGE */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
  justify-content:center;padding:12px;background:rgba(2,6,23,.42);backdrop-filter:blur(4px)
}
.overlay.show{display:flex}
.sheet{
  width:min(440px,100%);background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)
}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.actions button{height:43px;border-radius:13px;font-weight:800}
.cancel{border:1px solid var(--line);background:var(--soft);color:var(--text)}
.login{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}

.login-page{
  position:fixed;inset:0;z-index:200;
  overflow:auto;display:grid;place-items:center;
  padding:20px;background:var(--bg);
}
.login-card{
  width:min(420px,100%);margin:auto;
  padding:24px 20px 20px;
  border:1px solid var(--line);border-radius:24px;
  background:var(--card);box-shadow:0 22px 70px rgba(15,23,42,.13);
  text-align:center;
}
.login-mark{
  width:58px;height:58px;margin:0 auto 14px;border-radius:18px;
  display:grid;place-items:center;font-size:25px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  box-shadow:0 10px 24px rgba(79,70,229,.25);
}
.login-card h2{margin:0;font-size:22px;letter-spacing:-.4px}
.login-card>p{margin:7px 0 19px;color:var(--muted);font-size:13px;line-height:1.5}
.login-primary,.login-secondary{
  width:100%;height:45px;border-radius:13px;font-weight:850;margin-top:12px;
}
.login-primary{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.login-secondary{border:1px solid var(--line);background:var(--soft);color:var(--text)}

#chatComposer.hidden,
body:not(.in-chat) #chatComposer,
body.in-login #chatComposer{
  display:none!important;
}
body.in-chat .guest,
body.in-login .guest,
body.is-demo-session .guest{
  display:none!important;
}
body.in-login #homePage,
body.in-login #chatPage{
  display:none!important;
}
</style>
</head>
<body>
<main class="app">

  <!-- COMMUNITY HOME / GROUP LIST -->

</main>

<!-- AI-Style Bottom Composer -->
<footer class="chat-composer hidden" id="chatComposer" aria-hidden="true">

  </div>
</footer>

<div class="guest">

</div>

<section class="login-page hidden" id="loginPage" aria-label="Login page">

  </div>
</section>

<div class="overlay" id="overlay">

const $ = id => document.getElementById(id);
const home = $("homePage");
const chat = $("chatPage");
const groupsEl = $("groups");

let lang = "hi";
let sharedDark = false;
let requestedLanguage = "hi";
let pendingAction = null;
const joinedGroups = new Set();
let currentGroup = null;

function tr(){ return I18N[lang] || I18N.en; }
function groupName(g){ return g.name[lang] || g.name.en; }
function memberText(n){ return `${n.toLocaleString()} ${tr().members}`; }
function messageText(key){ return tr().msgs[key] || I18N.en.msgs[key]; }

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function renderGroups(){
  const list = GROUPS;
  $("groupCount").textContent = `${list.length} ${list.length === 1 ? tr().group : tr().groupsPlural}`;
  groupsEl.innerHTML = "";

  if(!list.length){
    groupsEl.innerHTML = `<div class="empty">${tr().noGroups}</div>`;
    return;
  }

  list.forEach(g=>{
    const b = document.createElement("button");
    b.className = "group";
    b.type = "button";
    b.innerHTML = `
      <div class="group-icon">${g.icon}<span class="chat-online-dot"></span></div>
      <div class="group-info">
        <div class="group-name">${groupName(g)}</div>
        <div class="members"><span class="chat-badge-pill">${memberText(g.members)}</span><span class="chat-status-live">● Active</span></div>
      </div>
      <div class="group-arrow">›</div>
    `;
    b.addEventListener("click",()=>openGroup(g.id));
    groupsEl.appendChild(b);
  });
}

function openGroup(id){
  currentGroup = GROUPS.find(g=>g.id===id);
  if(!currentGroup) return;

  $("chatIcon").textContent = currentGroup.icon;
  $("chatName").textContent = groupName(currentGroup);
  $("chatMembers").textContent = memberText(currentGroup.members);
  $("chatIcon").setAttribute("aria-label", groupName(currentGroup));
  $("chatName").title = groupName(currentGroup);
  updateJoinLeaveButton();

  setChatState(true);
  home.classList.add("hidden");
  chat.classList.remove("hidden");
  renderMessages();
  $("guestBtn").textContent = "🔒  " + tr().guestChat;
  if(window.CB_UPDATE_KEYBOARD_VIEWPORT) window.CB_UPDATE_KEYBOARD_VIEWPORT();
  const messages=$("messages");
  requestAnimationFrame(()=>{ if(messages) messages.scrollTop=messages.scrollHeight; });
}

function renderMessages(){
  if(!currentGroup) return;
  const el = $("messages");
  el.innerHTML = "";

  currentGroup.messages.forEach(m=>{
    if(m.type === "practice"){
      el.insertAdjacentHTML("beforeend",`
        <div class="practice-wrap">
          <div class="msg-card-head">
            <span class="msg-sender-wrap">
              <span class="msg-mini-avatar">${m.initial}</span>
              <span class="msg-sender-name">${escapeHtml(m.name)}</span>
              <span class="msg-role-pill">📊 ${escapeHtml(tr().practice)}</span>
            </span>
            <span class="msg-head-time">${escapeHtml(m.time)} · ${escapeHtml(tr().expires)}</span>
          </div>
          <div class="practice">
            <div class="practice-title">Mixed Calculation</div>
            <div class="stats">
              <div class="stat"><b>50</b><span>${escapeHtml(tr().questions)}</span></div>
              <div class="stat"><b>43</b><span>${escapeHtml(tr().correct)}</span></div>
              <div class="stat"><b>86%</b><span>${escapeHtml(tr().accuracy)}</span></div>
              <div class="stat"><b>12</b><span>${escapeHtml(tr().streak)}</span></div>
            </div>
          </div>
        </div>
      `);
      return;
    }

    const mine = !!m.mine;
    const isAdmin = m.role === "admin";
    const bodyText = m.text != null ? escapeHtml(m.text) : escapeHtml(messageText(m.key));

    if(mine){
      el.insertAdjacentHTML("beforeend",`
        <div class="msg mine">
          <div class="chat-role">${escapeHtml(tr().you || "You")}</div>
          <div class="text">${bodyText}</div>
          <div class="time">${escapeHtml(m.time)} · ${escapeHtml(tr().expires)}</div>
        </div>
      `);
      return;
    }

    const badgeText = isAdmin ? "🛡 ADMIN" : groupName(currentGroup);
    const badgeClass = isAdmin ? "msg-role-pill admin" : "msg-role-pill";
    const avatarIcon = isAdmin ? "🤖" : escapeHtml(m.initial || "👤");

    el.insertAdjacentHTML("beforeend",`
      <div class="msg ${isAdmin ? "admin-msg" : ""}">
        <div class="msg-card-head">
          <span class="msg-sender-wrap">
            <span class="msg-mini-avatar">${avatarIcon}</span>
            <span class="msg-sender-name">${escapeHtml(m.name)}</span>
            <span class="${badgeClass}">${escapeHtml(badgeText)}</span>
          </span>
          <span class="msg-head-time">${escapeHtml(m.time)} · ${escapeHtml(tr().expires)}</span>
        </div>
        <div class="msg-inner-box">${bodyText}</div>
      </div>
    `);
  });
  applyIntegratedCopy();
}

function setChatState(on){
  parent.postMessage({type:"cb-community-mode",chat:!!on},"*");
  document.body.classList.toggle("in-chat",!!on);
  const composer=$("chatComposer");
  if(composer){
    composer.classList.toggle("hidden",!on);
    composer.setAttribute("aria-hidden", on ? "false" : "true");
  }
  if(on) document.body.classList.remove("in-login");
}

function openLoginPage(action){
  pendingAction=action||null;
  document.body.classList.add("in-login");
  document.body.classList.remove("cb-keyboard-open");
  $("loginPage").classList.remove("hidden");
  $("chatComposer").classList.add("hidden");
  $("chatComposer").setAttribute("aria-hidden","true");
  updateLocalLoginButton();
  $("messageInput").blur();
}

function closeLoginPage(){
  pendingAction=null;
  document.body.classList.remove("in-login");
  $("loginPage").classList.add("hidden");
  if(currentGroup){
    $("chatComposer").classList.remove("hidden");
    $("chatComposer").setAttribute("aria-hidden","false");
    setChatState(true);
    if(window.CB_UPDATE_KEYBOARD_VIEWPORT) window.CB_UPDATE_KEYBOARD_VIEWPORT();
  }
}

function addLocalMessage(text){
  if(!currentGroup || !text.trim()) return;
  const now=new Date();
  const time=now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  currentGroup.messages.push({
    type:"text",
    mine:true,
    name:tr().you || "You",
    initial:"Y",
    key:null,
    text:text.trim(),
    time
  });

  renderMessages();
  $("messageInput").value="";
  updateComposer();

  const el=$("messages");
  requestAnimationFrame(()=>{ el.scrollTop=el.scrollHeight; });
}

function isGroupJoined(group){
  return !!group && joinedGroups.has(group.id);
}
function setGroupJoined(group,joined){
  if(!group) return;
  if(joined) joinedGroups.add(group.id);
  else joinedGroups.delete(group.id);
}
function updateJoinLeaveButton(){
  const btn=$("groupJoinBtn");
  if(!btn || !currentGroup) return;
  const joined=isGroupJoined(currentGroup);
  btn.classList.toggle("joined",joined);
  btn.classList.toggle("leave",joined);
  btn.textContent=joined?(lang==="hi"?"🗑️ डेमो छोड़ें":"🗑️ Leave demo"):(lang==="hi"?"➕ डेमो जुड़ें":"➕ Join demo");
}
function handleJoinLeave(){
  if(!currentGroup) return;
  if(!document.body.classList.contains("is-demo-session")){
    openLoginPage("join");
    return;
  }
  const joined=isGroupJoined(currentGroup);
  setGroupJoined(currentGroup,!joined);
  updateJoinLeaveButton();
}

function sendCommunityMessage(){
  const input=$("messageInput");
  if(!currentGroup) return;
  const text=input.value.trim();
  if(!text) return;

  if(document.body.classList.contains("is-demo-session")){
    addLocalMessage(text);
    return;
  }
  openLoginPage("send");
}

function updateComposer(){
  const input=$("messageInput");
  const count=input.value.length;
  $("composerCount").textContent=`${count}/500`;
  $("sendBtn").disabled=!input.value.trim();
}

function showHome(){
  currentGroup = null;
  setChatState(false);
  document.documentElement.style.setProperty("--cb-keyboard-offset","0px");
  document.body.classList.remove("cb-keyboard-open");
  chat.classList.add("hidden");
  home.classList.remove("hidden");
  $("guestBtn").textContent = "🔒  " + tr().guestHome;
  $("guestBtn").style.display = document.body.classList.contains("is-demo-session") ? "none" : "";
  if(document.scrollingElement) document.scrollingElement.scrollTop=0;
}

function applyLanguage(){
  const x = tr();
  $("sectionTitle").textContent = x.groups;
  $("guestBtn").textContent = "🔒  " + (currentGroup ? x.guestChat : x.guestHome);
  if(document.body.classList.contains("is-demo-session")){
    $("guestBtn").style.display="none";
  }
  $("cancel").textContent = x.cancel;
  $("login").textContent = x.login;
  $("loginTitle").textContent = x.loginRequired;
  $("loginText").textContent = x.loginText;
  const v7=V7_TEXT[lang]||V7_TEXT.en;
  $("messageInput").placeholder=v7.type;
  $("loginPageTitle").textContent=v7.loginTitle;
  $("loginPageText").textContent=v7.loginText;
  $("loginPrimary").textContent=v7.login;
  $("loginBack").textContent=v7.back;

  $("chatBack").setAttribute("aria-label",x.chatBack);
  renderGroups();

  if(currentGroup && !chat.classList.contains("hidden")){
    $("chatName").textContent = groupName(currentGroup);
    $("chatMembers").textContent = memberText(currentGroup.members);
    updateJoinLeaveButton();
    renderMessages();
  }

  applyIntegratedCopy();
  updateComposer();
}

function syncDocumentTheme(){
  document.documentElement.classList.toggle("dark",sharedDark);
  document.body.classList.toggle("dark",sharedDark);
}
$("chatBack").addEventListener("click",showHome);
$("groupJoinBtn").addEventListener("click",handleJoinLeave);
$("guestBtn").addEventListener("click",()=>{});
$("cancel").addEventListener("click",()=>$("overlay").classList.remove("show"));
$("overlay").addEventListener("click",e=>{
  if(e.target.id === "overlay") $("overlay").classList.remove("show");
});

function updateLocalLoginButton(){ $("loginPrimary").disabled=false; }
$("messageInput").addEventListener("input",updateComposer);
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendCommunityMessage();
  }
});
$("sendBtn").addEventListener("click",sendCommunityMessage);
$("loginBack").addEventListener("click",closeLoginPage);
$("loginPrimary").addEventListener("click",()=>{
  const action=pendingAction;
  document.body.classList.add("is-demo-session");
  closeLoginPage();
  $("guestBtn").style.display="none";
  if(currentGroup && action==="join"){setGroupJoined(currentGroup,true);updateJoinLeaveButton();}
  if(currentGroup && action==="send" && $("messageInput").value.trim()) addLocalMessage($("messageInput").value);
  applyIntegratedCopy();
});
setChatState(false);
updateComposer();
updateLocalLoginButton();

function applyIntegratedCopy(){
  const hi=lang==="hi";
  const note=hi?"Instant Community Chat • इन-मेमोरी डेमो चैट":"Instant Community Chat • In-memory Demo Chat";
  $("demoNotice").textContent=note;
  $("demoNotice").hidden=false;
  const unsupported=!I18N[requestedLanguage];
  $("languageFallback").hidden=!unsupported;
  $("languageFallback").textContent="Community translations for this language are not available yet; this section uses English.";
  $("guestBtn").textContent=hi?"डेमो संदेश केवल इस खुले पेज में रहते हैं।":"Demo messages exist only in this open page.";
  $("loginPageTitle").textContent=hi?"Frontend डेमो आज़माएँ":"Try the frontend demo";
  $("loginPageText").textContent=hi?"यह असली लॉगिन नहीं है। कोई ईमेल या पासवर्ड नहीं चाहिए। संदेश और सदस्यता केवल इस पेज का नमूना हैं; refresh पर मिटेंगे।":"This is not a real login. No email or password is needed. Messages and membership are page-only samples and reset on refresh.";
  $("loginPrimary").textContent=hi?"डेमो आज़माएँ":"Try demo";
  $("loginBack").textContent=hi?"वापस":"Back";
  if(currentGroup){
    $("groupJoinBtn").textContent=isGroupJoined(currentGroup)?(hi?"🗑️ डेमो छोड़ें":"🗑️ Leave demo"):(hi?"➕ डेमो जुड़ें":"➕ Join demo");
  }
  $("sendBtn").setAttribute("aria-label",hi?"डेमो संदेश भेजें":"Send demo message");
}

window.addEventListener("resize",applyIntegratedCopy);

window.addEventListener("message",e=>{
  if(!e.data) return;
  if(e.data.type==="cb-community-back" && currentGroup){
    showHome();
    return;
  }
  if(e.data.type!=="cb-community-settings" && e.data.type!=="cb-ai-chat-settings") return;
  requestedLanguage=String(e.data.lang||"hi");
  lang=I18N[requestedLanguage]?requestedLanguage:"en";
  sharedDark=!!e.data.dark;
  syncDocumentTheme();
  const tokens=e.data.tokens||{};
  ["bg","card","soft","text","muted","line","p","p2"].forEach(k=>{if(typeof tokens[k]==="string" && tokens[k])document.body.style.setProperty("--"+k,tokens[k]);});
  document.documentElement.lang=requestedLanguage;
  document.documentElement.dir=["ar","ur"].includes(requestedLanguage)?"rtl":"ltr";
  applyLanguage();
  syncThemeColor();
});

// Also sync from localStorage / parent frame directly
function syncFromStorageOrParent(){
  try{
    const lsDark = localStorage.getItem("cbDark");
    if(lsDark !== null){
      const d = (lsDark === "1");
      if(sharedDark !== d){ sharedDark = d; syncDocumentTheme(); syncThemeColor(); }
    }
    const lsLang = localStorage.getItem("cbLang");
    if(lsLang && I18N[lsLang] && lsLang !== lang){
      requestedLanguage = lsLang; lang = lsLang; applyLanguage();
    }
  }catch(e){}
}
window.addEventListener("storage", syncFromStorageOrParent);
setInterval(()=>{ if(document.visibilityState !== "hidden") syncFromStorageOrParent(); }, 450);

parent.postMessage({type:"cb-community-ready"},"*");
function syncThemeColor(){
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content",
    document.documentElement.classList.contains("dark") ? "#0b1020" : "#f6f8fc"
  );
}

syncFromStorageOrParent();
applyLanguage();
syncDocumentTheme();
syncThemeColor();
</script>

<script id="community-v17-keyboard-js">
(function(){
  const vv=window.visualViewport;
  const root=document.documentElement;

  function updateKeyboardViewport(){
    if(!vv) return;
    const layoutH=document.documentElement.clientHeight || window.innerHeight;
    const visibleBottom=vv.height + Math.max(0,vv.offsetTop);
    const keyboard=Math.max(0,layoutH-visibleBottom);

    root.style.setProperty("--cb-keyboard-offset",keyboard+"px");
    document.body.classList.toggle("cb-keyboard-open",keyboard>80);

    if(document.body.classList.contains("in-chat")){
      const sc=document.scrollingElement;
      if(sc) sc.scrollTop=0;
      const msgBox=document.getElementById("messages");
      if(msgBox) msgBox.scrollTop=msgBox.scrollHeight;
    }
  }

  if(vv){
    vv.addEventListener("resize",updateKeyboardViewport,{passive:true});
    vv.addEventListener("scroll",updateKeyboardViewport,{passive:true});
  }
  window.addEventListener("resize",updateKeyboardViewport,{passive:true});
  window.addEventListener("orientationchange",()=>setTimeout(updateKeyboardViewport,100),{passive:true});

  document.addEventListener("focusin",e=>{
    if(e.target && e.target.id==="messageInput"){
      setTimeout(updateKeyboardViewport,50);
      setTimeout(updateKeyboardViewport,180);
    }
  },true);

  document.addEventListener("focusout",e=>{
    if(e.target && e.target.id==="messageInput"){
      setTimeout(updateKeyboardViewport,150);
    }
  },true);

  window.CB_UPDATE_KEYBOARD_VIEWPORT=updateKeyboardViewport;
  setTimeout(updateKeyboardViewport,0);
})();
</script>
