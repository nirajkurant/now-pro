<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>NowPro — Community</title>
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--soft:#eef2f7;--text:#111827;--muted:#64748b;
  --line:#e2e8f0;--p:#4f46e5;--p2:#7c3aed;
  --shadow:0 8px 24px rgba(15,23,42,.055);
  --app-max:650px;
}
html.dark,body.dark{
  --bg:#0b1020;--card:#111827;--soft:#182235;--text:#f8fafc;--muted:#94a3b8;
  --line:#263449;--shadow:0 8px 25px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{
  width:min(var(--app-max),100%);margin:auto;
  padding:10px 14px calc(82px + env(safe-area-inset-bottom));
}
.hidden{display:none!important}

/* HEADER */
.top{
  height:58px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.back,.theme{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);color:var(--p);
  display:grid;place-items:center;box-shadow:0 3px 10px rgba(79,70,229,.08);
  transition:transform .15s ease,background .15s ease;
}
.back span{
  width:11px;height:11px;border-left:3px solid currentColor;
  border-bottom:3px solid currentColor;transform:rotate(45deg);margin-left:4px;
}
.back:active,.theme:active{transform:scale(.92)}
body.dark .back{
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  border-color:transparent;box-shadow:0 5px 14px rgba(79,70,229,.27)
}
.brand{flex:1;text-align:center;font-size:18px;font-weight:850;letter-spacing:-.3px}
.theme{font-size:19px}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:16px 2px 9px;
}
.section-title{font-size:14px;font-weight:850}
.count{font-size:10px;color:var(--muted);background:var(--soft);padding:5px 9px;border-radius:999px}

/* GROUP LIST */
.groups{display:grid;gap:10px}
.group{
  position:relative;isolation:isolate;overflow:hidden;
  width:100%;min-width:0;display:flex;align-items:center;gap:12px;padding:14px;
  text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--card) 96%,var(--p) 4%),var(--card));
  color:var(--text);border:1px solid color-mix(in srgb,var(--line) 82%,var(--p) 18%);
  border-radius:19px;box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.group::before{content:"";position:absolute;z-index:-1;right:-25px;top:-34px;width:92px;height:92px;border-radius:50%;
  background:color-mix(in srgb,var(--p) 7%,transparent);pointer-events:none}
.group:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.group:active{transform:scale(.992)}
.group-icon{
  width:50px;height:50px;flex:0 0 50px;border-radius:15px;
  background:linear-gradient(145deg,var(--soft),color-mix(in srgb,var(--card) 70%,var(--p) 30%));
  border:1px solid color-mix(in srgb,var(--line) 85%,var(--p) 15%);
  display:grid;place-items:center;font-size:23px;
}
.group-info{min-width:0;flex:1}
.group-name{font-size:15px;font-weight:850;line-height:1.3;overflow-wrap:anywhere}
.members{font-size:11px;color:var(--muted);margin-top:5px}
.group-arrow{
  width:32px;height:32px;flex:0 0 32px;border-radius:11px;
  display:grid;place-items:center;color:var(--p);background:color-mix(in srgb,var(--soft) 86%,var(--p) 14%);
  border:1px solid color-mix(in srgb,var(--line) 80%,var(--p) 20%);font-size:19px;
}
.empty{
  text-align:center;padding:30px 15px;border:1px dashed var(--line);
  border-radius:18px;color:var(--muted);font-size:12px;
}

/* CHAT */
.chat-page{padding-top:0}
.chat-head{
  display:flex;align-items:center;gap:9px;padding:8px 0 11px;
  border-bottom:1px solid var(--line);
}
.chat-head .back{width:40px;height:40px;flex-basis:40px}
.chat-group-icon{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;
  background:var(--soft);display:grid;place-items:center;font-size:20px;
}
.chat-title{min-width:0;flex:1}
.chat-name{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-members{font-size:10px;color:var(--muted);margin-top:3px}
.chat-messages{
  display:flex;flex-direction:column;gap:17px;
  padding:18px 1px calc(76px + env(safe-area-inset-bottom));
}
.msg{display:flex;align-items:flex-end;gap:9px;min-width:0}
.avatar{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  background:var(--soft);color:var(--p);display:grid;place-items:center;
  font-weight:800;font-size:15px;
}
.bubble{
  min-width:0;max-width:calc(100% - 49px);padding:11px 14px 10px;
  border-radius:17px 17px 17px 5px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.name{font-size:11px;font-weight:850;color:var(--p);margin-bottom:5px}
.text{font-size:15px;line-height:1.43;overflow-wrap:anywhere;word-break:break-word}
.time{text-align:right;font-size:10px;color:var(--muted);margin-top:7px}
.mine{justify-content:flex-end}
.mine .avatar{display:none}
.mine .bubble{
  max-width:82%;color:#fff;border:0;
  background:linear-gradient(135deg,var(--p),var(--p2));
  border-radius:17px 17px 5px 17px;box-shadow:0 8px 20px rgba(79,70,229,.18)
}
.mine .time{color:rgba(255,255,255,.72)}

/* PRACTICE */
.practice-wrap{display:flex;align-items:flex-end;gap:9px;min-width:0}
.practice{
  width:min(265px,calc(100% - 49px));min-width:0;padding:11px 14px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:17px 17px 17px 5px;
  box-shadow:var(--shadow)
}
.practice-label{font-size:10px;font-weight:900;color:var(--p)}
.practice-title{font-size:17px;font-weight:850;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.stat{text-align:center;padding:8px 4px;background:var(--soft);border-radius:11px}
.stat b{display:block;font-size:18px;line-height:1.1}
.stat span{display:block;font-size:9px;color:var(--muted);margin-top:3px}

/* GUEST */
.guest{
  position:fixed;left:50%;bottom:0;z-index:30;transform:translateX(-50%);
  width:min(var(--app-max),100%);min-height:62px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:grid;place-items:center;text-align:center;
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  border-top:1px solid var(--line);backdrop-filter:blur(12px);
  color:var(--muted);font-size:12px;
}
.guest button{border:0;background:none;color:inherit}

/* LOGIN */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
  justify-content:center;padding:12px;background:rgba(2,6,23,.42);backdrop-filter:blur(4px)
}
.overlay.show{display:flex}
.sheet{
  width:min(440px,100%);background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)
}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.actions button{height:43px;border-radius:13px;font-weight:800}
.cancel{border:1px solid var(--line);background:var(--soft);color:var(--text)}
.login{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}

/* DEVICE OPTIMIZATION */
@media(max-width:360px){
  .app{padding-left:10px;padding-right:10px}
  .brand{font-size:16px}
  .hero{padding:14px}
  .hero h1{font-size:19px}
  .group{padding:10px}
  .group-icon{width:44px;height:44px;flex-basis:44px}
  .group-name{font-size:14px}
  .bubble{padding:10px 12px}
  .text{font-size:14px}
  .avatar{width:36px;height:36px;flex-basis:36px}
  .practice{width:min(245px,calc(100% - 45px))}
}
@media(min-width:700px){
  :root{--app-max:920px}
  .app{padding-left:20px;padding-right:20px}
  .hero{padding:20px}
  .groups{grid-template-columns:1fr 1fr}
  .chat-messages{padding-left:18px;padding-right:18px}
}
@media(min-width:1100px){
  :root{--app-max:1040px}
  .groups{grid-template-columns:1fr 1fr}
}
@media(orientation:landscape) and (max-height:520px){
  .app{padding-top:6px}
  .top{height:50px}
  .hero{margin-top:5px;padding:12px}
  .hero p{display:none}
  .chat-messages{gap:11px;padding-top:11px}
  .guest{min-height:50px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}

/* NowPro v204: restrained tool-like card treatment for Community */
.feature-card,.community-tool,.tool-card{
  border-color:color-mix(in srgb,var(--line) 84%,var(--p) 16%);
  background:linear-gradient(145deg,color-mix(in srgb,var(--card) 97%,var(--p) 3%),var(--card));
  box-shadow:var(--shadow);
}
</style>




<style id="community-v7-smooth">
html,body,.top,.hero,.search,.group,.group-icon,.group-arrow,.chat-head,
.chat-group-icon,.bubble,.practice,.stat,.guest,.sheet,.lang-sheet,.lang-option,
.lang-close,.chat-composer,.composer-input,.send-btn,.back,.theme,.lang-btn{
  transition:
    background-color .22s ease,
    background .22s ease,
    border-color .22s ease,
    color .22s ease,
    box-shadow .22s ease,
    opacity .18s ease,
    transform .18s ease;
}
.theme{transition:background .22s ease,color .22s ease,transform .28s ease,box-shadow .22s ease}
.theme:active{transform:scale(.91) rotate(-10deg)}
body.theme-switching .theme{transform:rotate(18deg) scale(1.04)}
body.dark .theme{
  background:var(--soft);
  color:#facc15;
  border-color:var(--line);
  box-shadow:0 5px 16px rgba(0,0,0,.20);
}
body.dark .lang-btn{
  background:var(--soft);
  border-color:var(--line);
}
</style>


<style id="community-v7-composer-login">
.chat-composer{
  position:fixed;left:50%;bottom:0;z-index:35;
  width:min(var(--app-max),100%);
  transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.composer-box{
  position:relative;flex:1;min-width:0;height:46px;
}
.composer-input{
  width:100%;height:46px;border:1px solid var(--line);border-radius:15px;
  outline:none;background:var(--card);color:var(--text);
  padding:0 52px 0 14px;font-size:14px;
  box-shadow:0 4px 14px rgba(15,23,42,.05);
}
.composer-input:focus{
  border-color:color-mix(in srgb,var(--p) 55%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 12%,transparent);
}
.composer-count{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:9px;pointer-events:none;
}
.send-btn{
  width:46px;height:46px;flex:0 0 46px;border:0;border-radius:15px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  display:grid;place-items:center;font-size:21px;
  box-shadow:0 8px 20px rgba(79,70,229,.25);
}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.48;box-shadow:none}
body.dark .chat-composer{
  background:color-mix(in srgb,var(--bg) 88%,transparent);
}
body.dark .composer-input{box-shadow:0 5px 18px rgba(0,0,0,.20)}

.login-page{
  position:fixed;inset:0;z-index:80;
  overflow:auto;
  display:grid;place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 90% 5%,rgba(124,58,237,.16),transparent 35%),
    var(--bg);
}
.login-card{
  width:min(420px,100%);
  padding:24px 20px 20px;
  border:1px solid var(--line);border-radius:24px;
  background:var(--card);box-shadow:0 22px 70px rgba(15,23,42,.13);
  text-align:center;
}
.login-mark{
  width:58px;height:58px;margin:0 auto 14px;border-radius:18px;
  display:grid;place-items:center;font-size:25px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  box-shadow:0 10px 24px rgba(79,70,229,.25);
}
.login-card h2{margin:0;font-size:22px;letter-spacing:-.4px}
.login-card>p{margin:7px 0 19px;color:var(--muted);font-size:13px;line-height:1.5}
.login-field{display:block;text-align:left;margin-top:10px}
.login-field span{display:block;font-size:11px;font-weight:800;margin:0 0 5px;color:var(--text)}
.login-field input{
  width:100%;height:45px;border:1px solid var(--line);border-radius:13px;
  background:var(--soft);color:var(--text);outline:none;padding:0 12px;font-size:14px;
}
.login-field input:focus{
  border-color:color-mix(in srgb,var(--p) 55%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 12%,transparent);
}
.login-primary,.login-secondary{
  width:100%;height:45px;border-radius:13px;font-weight:850;margin-top:12px;
}
.login-primary{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.login-secondary{border:1px solid var(--line);background:var(--soft);color:var(--text)}
@media(max-width:360px){
  .chat-composer{padding-left:9px;padding-right:9px}
  .composer-input{font-size:13px}
  .login-card{padding:20px 16px}
}
</style>


<style id="community-v7-state">
body.in-chat .guest{display:none}
body.in-chat .chat-composer{display:flex!important}
body.in-login .guest,body.in-login .chat-composer{display:none!important}
body.in-login #homePage,body.in-login #chatPage{display:none!important}
</style>


<style id="community-v8-login-state">
body.is-demo-session .guest{display:none!important}
body.is-demo-session .chat-composer{display:flex!important}
body.is-demo-session .composer-input{opacity:1}
.local-user-badge{
  display:none;
  align-items:center;gap:6px;
  font-size:10px;font-weight:800;color:var(--good);
  padding:5px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--good) 9%,var(--card));
  border:1px solid color-mix(in srgb,var(--good) 25%,var(--line));
}
body.is-demo-session .local-user-badge{display:inline-flex}
</style>





<style id="community-v8-login-disabled">
.login-primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
</style>


<style id="community-v9-admin-css">
.admin-msg .bubble{
  border-color:color-mix(in srgb,var(--p) 32%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--p) 7%,var(--card)),var(--card));
  box-shadow:0 7px 22px rgba(79,70,229,.08);
}
body.dark .admin-msg .bubble{
  border-color:color-mix(in srgb,var(--p) 40%,var(--line));
  background:linear-gradient(145deg,color-mix(in srgb,var(--p) 14%,var(--card)),var(--card));
}
.admin-avatar{
  position:relative!important;
  background:linear-gradient(135deg,var(--p),var(--p2))!important;
  color:#fff!important;
  border-color:transparent!important;
  box-shadow:0 6px 16px rgba(79,70,229,.20);
}
.admin-avatar::after{
  content:"✓";position:absolute;right:-4px;bottom:-3px;width:15px;height:15px;
  border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;
  border:2px solid var(--card);font-size:8px;font-weight:900;
}
.admin-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.admin-name-row .name{margin:0}
.admin-badge{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  font-size:9px;font-weight:900;letter-spacing:.25px;
}
.admin-label{
  margin:0 0 6px;color:var(--p);font-size:9px;font-weight:900;
  letter-spacing:.5px;text-transform:uppercase;
}
.admin-system-note{
  width:fit-content;max-width:92%;margin:3px auto 10px;padding:6px 10px;
  border-radius:999px;border:1px solid color-mix(in srgb,var(--p) 20%,var(--line));
  background:color-mix(in srgb,var(--p) 6%,var(--card));color:var(--muted);font-size:9px;
}
</style>

<style id="community-v11-composer-visibility">
/* The composer belongs ONLY to a group-chat screen. */
#chatComposer.hidden,
body:not(.in-chat) #chatComposer{
  display:none !important;
}
body.in-chat #chatComposer{
  display:flex !important;
}
</style>

<style id="community-v12-document-theme">
html,body{
  background:var(--bg);
  color:var(--text);
  min-height:100%;
}
html{
  color-scheme:light;
  transition:background-color .22s ease,color .22s ease;
}
html.dark{
  color-scheme:dark;
}
body{
  background:var(--bg);
  transition:background-color .22s ease,color .22s ease;
}
</style>



<style id="community-v14-join-leave">
.group-members-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.group-members-row .member-count{flex:1 1 auto}
.group-join-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--p);
  min-height:38px;
  padding:8px 14px;
  border-radius:12px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  transition:transform .16s ease,background .2s ease,border-color .2s ease,color .2s ease;
}
.group-join-btn:active{transform:scale(.97)}
.group-join-btn.joined{
  background:var(--soft);
  color:var(--text);
}
.group-join-btn.leave{
  color:var(--bad);
}
.group-join-btn:disabled{opacity:.6;cursor:not-allowed}
</style>





<style id="community-v17-chat-layout">
/* CHAT: fixed identity header + independently scrolling messages + keyboard-safe composer */
body.in-chat{
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
body.in-chat #chatPage{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100dvh!important;
  min-height:100dvh!important;
  max-height:100dvh!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  background:var(--bg)!important;
  z-index:10!important;
}

/* Main site header stays visible and never participates in message scrolling. */
body.in-chat #chatPage>.top{
  position:fixed!important;
  top:0!important;
  left:0!important;
  right:0!important;
  height:58px!important;
  padding:0 14px!important;
  box-sizing:border-box!important;
  z-index:80!important;
}

/* Group identity is ALWAYS visible directly below the main header. */
body.in-chat .chat-head{
  position:fixed!important;
  top:58px!important;
  left:0!important;
  right:0!important;
  min-height:72px!important;
  padding:9px 14px 10px!important;
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  gap:10px!important;
  background:color-mix(in srgb,var(--bg) 96%,transparent)!important;
  border-bottom:1px solid var(--line)!important;
  backdrop-filter:blur(14px)!important;
  -webkit-backdrop-filter:blur(14px)!important;
  z-index:79!important;
  overflow:visible!important;
}
body.in-chat .chat-group-icon{
  display:grid!important;
  visibility:visible!important;
  opacity:1!important;
  width:48px!important;
  height:48px!important;
  min-width:48px!important;
  flex:0 0 48px!important;
  border-radius:15px!important;
  place-items:center!important;
  font-size:23px!important;
  background:var(--soft)!important;
  color:var(--text)!important;
}
body.in-chat .chat-title{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  min-width:0!important;
  flex:1 1 auto!important;
  overflow:hidden!important;
}
body.in-chat .chat-name{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  font-size:16px!important;
  font-weight:850!important;
  line-height:1.2!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
}
body.in-chat .group-members-row{
  display:flex!important;
  align-items:center!important;

const $ = id => document.getElementById(id);
const home = $("homePage");
const chat = $("chatPage");
const groupsEl = $("groups");

let lang = "en"; let sharedDark=false; let requestedLanguage="en"; let pendingAction=null; const joinedGroups=new Set();
let currentGroup = null;

function tr(){ return I18N[lang] || I18N.en; }
function groupName(g){ return g.name[lang] || g.name.en; }
function memberText(n){ return `${lang==="hi"?"नमूना":"Sample"} · ${n.toLocaleString()} ${tr().members}`; }
function messageText(key){ return tr().msgs[key] || I18N.en.msgs[key]; }

function renderGroups(){
  const list = GROUPS;

  $("groupCount").textContent =
    `${list.length} ${list.length === 1 ? tr().group : tr().groupsPlural}`;

  groupsEl.innerHTML = "";

  if(!list.length){
    groupsEl.innerHTML = `<div class="empty">${tr().noGroups}</div>`;
    return;
  }

  list.forEach(g=>{
    const b = document.createElement("button");
    b.className = "group";
    b.type = "button";
    b.innerHTML = `
      <div class="group-icon">${g.icon}</div>
      <div class="group-info">
        <div class="group-name">${groupName(g)}</div>
      <div class="members">${memberText(g.members)}</div>
      </div>
      <div class="group-arrow">›</div>
    `;
    b.addEventListener("click",()=>openGroup(g.id));
    groupsEl.appendChild(b);
  });
}
function openGroup(id){
  currentGroup = GROUPS.find(g=>g.id===id);
  if(!currentGroup) return;

  $("chatIcon").textContent = currentGroup.icon;
  $("chatName").textContent = groupName(currentGroup);
  $("chatMembers").textContent = memberText(currentGroup.members);
  $("chatIcon").setAttribute("aria-label", groupName(currentGroup));
  $("chatName").title = groupName(currentGroup);
  updateJoinLeaveButton();

  setChatState(true);
  home.classList.add("hidden");
  chat.classList.remove("hidden");
  renderMessages();
  $("guestBtn").textContent = "🔒  " + tr().guestChat;
  if(window.CB_UPDATE_KEYBOARD_VIEWPORT) window.CB_UPDATE_KEYBOARD_VIEWPORT();
  const messages=$("messages");
  requestAnimationFrame(()=>{ if(messages) messages.scrollTop=messages.scrollHeight; });
}


function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function renderMessages(){
  if(!currentGroup) return;

  const el = $("messages");
  el.innerHTML = "";

  currentGroup.messages.forEach(m=>{
    if(m.type === "practice"){
      el.insertAdjacentHTML("beforeend",`
        <div class="practice-wrap">
          <div class="avatar">${m.initial}</div>
          <div class="practice">
            <div class="name">${m.name}</div>
            <div class="practice-label">📊 ${tr().practice}</div>
            <div class="practice-title">Mixed Calculation</div>
            <div class="stats">
              <div class="stat"><b>50</b><span>${tr().questions}</span></div>
              <div class="stat"><b>43</b><span>${tr().correct}</span></div>
              <div class="stat"><b>86%</b><span>${tr().accuracy}</span></div>
              <div class="stat"><b>12</b><span>${tr().streak}</span></div>
            </div>
            <div class="time">${m.time} · ${tr().expires}</div>
          </div>
        </div>
      `);
      return;
    }

    const mine = !!m.mine;
    const isAdmin = m.role === "admin";

    el.insertAdjacentHTML("beforeend",`
      <div class="msg ${mine ? "mine" : ""} ${isAdmin ? "admin-msg" : ""}">
        ${mine ? "" : `<div class="avatar ${isAdmin ? "admin-avatar" : ""}">${m.initial}</div>`}
        <div class="bubble">
          ${mine ? "" : (isAdmin
            ? `<div class="admin-label">Official group message</div>
               <div class="admin-name-row"><div class="name">${m.name}</div><span class="admin-badge">🛡 ADMIN</span></div>`
            : `<div class="name">${m.name}</div>`)}
          <div class="text">${m.text != null ? escapeHtml(m.text) : messageText(m.key)}</div>
          <div class="time">${m.time} · ${tr().expires}</div>
        </div>
      </div>
    `);
    if(isAdmin){
      el.insertAdjacentHTML("beforeend",`<div class="admin-system-note">🛡 Official admin message</div>`);
    }
  });
  applyIntegratedCopy();
}

function setChatState(on){
  parent.postMessage({type:"cb-community-mode",chat:!!on},"*");
  document.body.classList.toggle("in-chat",!!on);
  const composer=$("chatComposer");
  if(composer){
    composer.classList.toggle("hidden",!on);
    composer.setAttribute("aria-hidden", on ? "false" : "true");
  }
  if(on) document.body.classList.remove("in-login");
}

function openLoginPage(action){
  pendingAction=action||null;
  document.body.classList.add("in-login");
  document.body.classList.remove("cb-keyboard-open");
  $("loginPage").classList.remove("hidden");
  $("chatComposer").classList.add("hidden");
  $("chatComposer").setAttribute("aria-hidden","true");
  
  
  updateLocalLoginButton();
  $("messageInput").blur();
  
}

function closeLoginPage(){
  pendingAction=null;
  document.body.classList.remove("in-login");
  $("loginPage").classList.add("hidden");
  if(currentGroup){
    $("chatComposer").classList.remove("hidden");
    $("chatComposer").setAttribute("aria-hidden","false");
    setChatState(true);
    if(window.CB_UPDATE_KEYBOARD_VIEWPORT) window.CB_UPDATE_KEYBOARD_VIEWPORT();
  }
}


function addLocalMessage(text){
  if(!currentGroup || !text.trim()) return;

  const now=new Date();
  const time=now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  currentGroup.messages.push({
    type:"text",
    mine:true,
    name:"You",
    initial:"Y",
    key:null,
    text:text.trim(),
    time
  });

  renderMessages();
  $("messageInput").value="";
  updateComposer();

  const el=$("messages");
  requestAnimationFrame(()=>{ el.scrollTop=el.scrollHeight; });
}


function communityMembershipKey(group){
  return group ? "cb-community-joined-"+group.id : "";
}
function isGroupJoined(group){
  return !!group && joinedGroups.has(group.id);
}
function setGroupJoined(group,joined){
  if(!group) return;
  if(joined) joinedGroups.add(group.id);
  else joinedGroups.delete(group.id);
}
function updateJoinLeaveButton(){
  const btn=$("groupJoinBtn");
  if(!btn || !currentGroup) return;
  const joined=isGroupJoined(currentGroup);
  btn.textContent=joined ? "Leave" : "Join";
  btn.classList.toggle("joined",joined);
  btn.classList.toggle("leave",joined);
  btn.textContent=joined?(lang==="hi"?"डेमो छोड़ें":"Leave demo"):(lang==="hi"?"डेमो जुड़ें":"Join demo");
}
function handleJoinLeave(){
  if(!currentGroup) return;

  if(!document.body.classList.contains("is-demo-session")){
    // Demo participation is explicit; no real authentication is performed.
    openLoginPage("join");
    return;
  }

  const joined=isGroupJoined(currentGroup);
  setGroupJoined(currentGroup,!joined);
  updateJoinLeaveButton();
}

function sendCommunityMessage(){
  const input=$("messageInput");
  if(!currentGroup) return; // Composer must never send from the group-list screen.

  const text=input.value.trim();
  if(!text) return;

  if(document.body.classList.contains("is-demo-session")){
    addLocalMessage(text);
    return;
  }

  // Guest: offer a clearly labeled frontend demo only when sending.
  openLoginPage("send");
}

function updateComposer(){
  const input=$("messageInput");
  const count=input.value.length;
  $("composerCount").textContent=`${count}/500`;
  $("sendBtn").disabled=!input.value.trim();
}

function showHome(){
  currentGroup = null;
  setChatState(false);
  document.documentElement.style.setProperty("--cb-keyboard-offset","0px");
  document.body.classList.remove("cb-keyboard-open");
  chat.classList.add("hidden");
  home.classList.remove("hidden");
  $("guestBtn").textContent = "🔒  " + tr().guestHome;
  $("guestBtn").style.display = document.body.classList.contains("is-demo-session") ? "none" : "";
  if(document.scrollingElement) document.scrollingElement.scrollTop=0;
}

function applyLanguage(){
  const x = tr();

  $("sectionTitle").textContent = x.groups;

  requestedLanguage=String(e.data.lang||"en");
  lang=I18N[requestedLanguage]?requestedLanguage:"en";
  sharedDark=!!e.data.dark;
  syncDocumentTheme();
  const tokens=e.data.tokens||{};
  ["bg","card","soft","text","muted","line","p","p2"].forEach(k=>{if(typeof tokens[k]==="string")document.body.style.setProperty("--"+k,tokens[k]);});
  document.documentElement.lang=requestedLanguage;
  document.documentElement.dir=["ar","ur"].includes(requestedLanguage)?"rtl":"ltr";
  applyLanguage();
  syncThemeColor();
});

  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content",
    document.documentElement.classList.contains("dark") ? "#0b1020" : "#f6f8fc"
  );
}

applyLanguage();
syncDocumentTheme();
syncThemeColor();
</script>





<script id="community-v17-keyboard-js">
(function(){
  const vv=window.visualViewport;
  const root=document.documentElement;

  function updateKeyboardViewport(){
    if(!vv) return;

    const layoutH=document.documentElement.clientHeight || window.innerHeight;
    const visibleBottom=vv.height + Math.max(0,vv.offsetTop);
    const keyboard=Math.max(0,layoutH-visibleBottom);

    root.style.setProperty("--cb-keyboard-offset",keyboard+"px");
    document.body.classList.toggle("cb-keyboard-open",keyboard>80);

    /* Keep the document at its top; only #messages is allowed to scroll. */
    if(document.body.classList.contains("in-chat")){
      const sc=document.scrollingElement;
      if(sc) sc.scrollTop=0;
    }
  }

  if(vv){
    vv.addEventListener("resize",updateKeyboardViewport,{passive:true});
    vv.addEventListener("scroll",updateKeyboardViewport,{passive:true});
  }
  window.addEventListener("resize",updateKeyboardViewport,{passive:true});
  window.addEventListener("orientationchange",()=>setTimeout(updateKeyboardViewport,100),{passive:true});

  document.addEventListener("focusin",e=>{
    if(e.target && e.target.id==="messageInput"){
      setTimeout(updateKeyboardViewport,50);
      setTimeout(updateKeyboardViewport,180);
    }
  },true);

  document.addEventListener("focusout",e=>{
    if(e.target && e.target.id==="messageInput"){
      setTimeout(updateKeyboardViewport,150);
    }
  },true);

  window.CB_UPDATE_KEYBOARD_VIEWPORT=updateKeyboardViewport;
  setTimeout(updateKeyboardViewport,0);
})();
</script>
</body>
</html>
