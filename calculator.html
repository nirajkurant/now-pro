<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Smart Calculator — NowPro</title>
<style>
:root {
  --bg: #eef2ff;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #dbe3f2;
  --p: #6d4aff;
  --p2: #9333ea;
  --soft: #f8fafc;
  --bad: #dc2626;
  --good: #16a34a;
}
html.dark, body.dark {
  --bg: #080d1a;
  --card: #111827;
  --text: #f8fafc;
  --muted: #94a3b8;
  --line: #1e293b;
  --p: #7c5cff;
  --p2: #a855f7;
  --soft: #172033;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--card);
  color: var(--text);
  user-select: none;
}
.calc-app {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 680px;
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  background: var(--card);
  overflow: hidden;
}
.calc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--card) 88%, var(--soft));
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.calc-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.calc-avatar {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(139,92,246,0.22));
  border: 1px solid rgba(99,102,241,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  flex-shrink: 0;
}
.calc-avatar-dot {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 10px;
  height: 10px;
  background: #10b981;
  border: 2px solid var(--card);
  border-radius: 50%;
}
.calc-title-wrap { min-width: 0; }
.calc-title {
  font-size: 15.5px;
  font-weight: 850;
  color: var(--text);
  line-height: 1.2;
}
.calc-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
}
.calc-close-top {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--soft);
  color: var(--muted);
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.calc-close-top:active { transform: scale(0.92); }

.calc-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  padding: clamp(12px, 2.2vh, 18px) clamp(14px, 3vw, 20px);
  gap: clamp(10px, 1.8vh, 14px);
  min-height: 0;
}
.calc-display {
  border: 1.5px solid var(--line);
  border-radius: 20px;
  background: linear-gradient(145deg, var(--soft), var(--card));
  padding: clamp(14px, 2.5vh, 22px) 18px;
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: clamp(110px, 20vh, 155px);
  flex-shrink: 0;
}
.calc-exp {
  min-height: 22px;
  font-size: clamp(14px, 2.2vh, 17px);
  color: var(--muted);
  font-weight: 700;
  word-break: break-all;
  margin-bottom: 6px;
}
.calc-out {
  font-size: clamp(32px, 5.4vh, 46px);
  font-weight: 950;
  letter-spacing: -0.02em;
  word-break: break-all;
  line-height: 1.1;
}
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 1fr;
  gap: clamp(8px, 1.4vh, 12px);
  flex: 1 1 auto;
  min-height: 0;
}
.calc-key {
  min-height: 48px;
  height: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--soft);
  color: var(--text);
  font-size: clamp(19px, 3vh, 24px);
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .1s ease, background .12s ease;
}
.calc-key:active {
  transform: scale(0.95);
}
.calc-key.op {
  color: var(--p);
  background: rgba(109,74,255,.1);
  border-color: rgba(109,74,255,.22);
  font-size: clamp(20px, 3.2vh, 26px);
}
.calc-key.eq {
  background: linear-gradient(135deg, var(--p), var(--p2));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px rgba(109,74,255,.28);
}
.calc-key.danger {
  color: var(--bad);
  background: rgba(220,38,38,.09);
  border-color: rgba(220,38,38,.2);
}
.calc-close {
  width: 100%;
  min-height: 44px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--soft);
  color: var(--text);
  font-weight: 850;
  font-size: 14px;
  cursor: pointer;
  flex-shrink: 0;
}
.calc-close:active { transform: scale(0.98); }
</style>
</head>
<body class="dark">
<div class="calc-app">
  <header class="calc-header">
    <div class="calc-brand">
      <div class="calc-avatar">🧮<span class="calc-avatar-dot"></span></div>
      <div class="calc-title-wrap">
        <div class="calc-title" id="calcTitle">Smart Calculator</div>
        <div class="calc-sub" id="calcSub">Fast &amp; smart calculation</div>
      </div>
    </div>
    <button class="calc-close-top" type="button" id="closeCalcTopBtn" aria-label="Close">✕</button>
  </header>

  <main class="calc-body">
    <div class="calc-display" aria-live="polite">
      <div class="calc-exp" id="calcExp"></div>
      <div class="calc-out" id="calcOut">0</div>
    </div>

    <div class="calc-grid" id="calcGrid">
      <button class="calc-key danger" type="button" data-calc="AC">AC</button>
      <button class="calc-key op" type="button" data-calc="DEL">⌫</button>
      <button class="calc-key op" type="button" data-calc="%">%</button>
      <button class="calc-key op" type="button" data-calc="/">÷</button>
      <button class="calc-key" type="button" data-calc="7">7</button>
      <button class="calc-key" type="button" data-calc="8">8</button>
      <button class="calc-key" type="button" data-calc="9">9</button>
      <button class="calc-key op" type="button" data-calc="*">×</button>
      <button class="calc-key" type="button" data-calc="4">4</button>
      <button class="calc-key" type="button" data-calc="5">5</button>
      <button class="calc-key" type="button" data-calc="6">6</button>
      <button class="calc-key op" type="button" data-calc="-">−</button>
      <button class="calc-key" type="button" data-calc="1">1</button>
      <button class="calc-key" type="button" data-calc="2">2</button>
      <button class="calc-key" type="button" data-calc="3">3</button>
      <button class="calc-key op" type="button" data-calc="+">+</button>
      <button class="calc-key" type="button" data-calc="00">00</button>
      <button class="calc-key" type="button" data-calc="0">0</button>
      <button class="calc-key" type="button" data-calc=".">.</button>
      <button class="calc-key eq" type="button" data-calc="=">=</button>
    </div>

    <button class="calc-close" type="button" id="closeCalculatorBtn">Close</button>
  </main>
</div>
<script>
(function(){
  const LANG_TEXT = {
    hi: { title: 'स्मार्ट कैलकुलेटर', sub: 'तेज़ और स्मार्ट गणना करें', close: 'बंद करें', err: 'त्रुटि' },
    en: { title: 'Smart Calculator', sub: 'Fast & smart calculation', close: 'Close', err: 'Error' },
    bn: { title: 'স্মার্ট ক্যালকুলেটর', sub: 'দ্রুত ও স্মার্ট হিসাব করুন', close: 'বন্ধ করুন', err: 'ত্রুটি' },
    mr: { title: 'स्मार्ट कॅल्क्युलेटर', sub: 'जलद आणि स्मार्ट गणना करा', close: 'बंद करा', err: 'त्रुटी' },
    te: { title: 'స్మార్ట్ కాలిక్యులేటర్', sub: 'వేగంగా & స్మార్ట్‌గా లెక్కించండి', close: 'మూసివేయి', err: 'లోపం' },
    ta: { title: 'ஸ்மார்ட் கால்குலேட்டர்', sub: 'வேகமான மற்றும் ஸ்மார்ட் கணக்கீடு', close: 'மூடு', err: 'பிழை' },
    gu: { title: 'સ્માર્ટ કેલ્ક્યુલેટર', sub: 'ઝડપી અને સ્માર્ટ ગણતરી કરો', close: 'બંધ કરો', err: 'ભૂલ' },
    ur: { title: 'سمارٹ کیلکولیٹر', sub: 'تیز اور سمارٹ حساب کریں', close: 'بند کریں', err: 'خرابی' },
    as: { title: 'স্মাৰ্ট কেলকুলেটৰ', sub: 'দ্ৰুত আৰু স্মাৰ্ট গণনা কৰক', close: 'বন্ধ কৰক', err: 'ত্ৰুটি' }
  };

  let curLang = 'hi';
  function applySync(lang, dark, tokens) {
    if (lang && LANG_TEXT[lang]) curLang = lang;
    const t = LANG_TEXT[curLang] || LANG_TEXT.en;
    document.documentElement.lang = curLang;
    document.documentElement.dir = (curLang === 'ur') ? 'rtl' : 'ltr';
    document.getElementById('calcTitle').textContent = t.title;
    document.getElementById('calcSub').textContent = t.sub;
    document.getElementById('closeCalculatorBtn').textContent = t.close;
    if (typeof dark === 'boolean') {
      document.documentElement.classList.toggle('dark', dark);
      document.body.classList.toggle('dark', dark);
    }
    if (tokens && typeof tokens === 'object') {
      Object.keys(tokens).forEach(function(k){
        if (tokens[k]) document.documentElement.style.setProperty('--' + k, tokens[k]);
      });
    }
  }

  function initFromStorage() {
    try {
      const p = new URLSearchParams(location.search);
      const lang = p.get('lang') || localStorage.getItem('cbLang') || localStorage.getItem('lang') || 'hi';
      const darkParam = p.get('dark');
      const cbDark = localStorage.getItem('cbDark');
      const isDark = darkParam !== null ? (darkParam === '1') : (cbDark !== null ? (cbDark === '1') : true);
      applySync(lang, isDark);
    } catch(e) {}
  }
  initFromStorage();

  let exp = '';
  const expEl = document.getElementById('calcExp');
  const outEl = document.getElementById('calcOut');

  function pretty(s) {
    return String(s || '').replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
  }

  function safeEval(raw) {
    const clean = String(raw || '').replace(/[^0-9+\-*/.%()]/g, '');
    if (!clean) return '0';
    const normalized = clean.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
    const val = Function('"use strict";return (' + normalized + ')')();
    if (!Number.isFinite(val)) throw new Error('bad');
    return String(Math.round((val + Number.EPSILON) * 100000000) / 100000000);
  }

  function render(out) {
    expEl.textContent = pretty(exp);
    outEl.textContent = out !== undefined ? out : (exp ? pretty(exp) : '0');
  }

  function press(key) {
    const t = LANG_TEXT[curLang] || LANG_TEXT.en;
    if (key === 'AC' || key === 'C') { exp = ''; render('0'); return; }
    if (key === 'DEL' || key === 'BACK') { exp = exp.slice(0, -1); render(exp ? pretty(exp) : '0'); return; }
    if (key === '=') {
      if (!exp) { render('0'); return; }
      try {
        const ans = safeEval(exp);
        expEl.textContent = pretty(exp) + ' =';
        exp = ans;
        outEl.textContent = ans;
      } catch(e) {
        outEl.textContent = t.err;
      }
      return;
    }
    if (['+', '-', '*', '/', '%'].includes(key)) {
      if (!exp && key !== '-') return;
      if (/[+\-*/%]$/.test(exp)) exp = exp.slice(0, -1) + key;
      else exp += key;
      render();
      return;
    }
    if (key === '.') {
      const last = exp.split(/[+\-*/%]/).pop() || '';
      if (last.includes('.')) return;
      exp += (last ? '.' : '0.');
      render();
      return;
    }
    exp = (exp === '0') ? key : exp + key;
    try {
      const live = /[0-9]$/.test(exp) && /[+\-*/%]/.test(exp) ? safeEval(exp) : pretty(exp);
      expEl.textContent = pretty(exp);
      outEl.textContent = live;
    } catch(e) {
      render();
    }
  }

  window.addEventListener('message', function(e) {
    const d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'cb-calculator-settings' || d.type === 'cb-sync') {
      applySync(d.lang, d.dark, d.tokens);
    } else if (d.type === 'cb-calculator-reset') {
      exp = '';
      render('0');
    } else if (d.type === 'cb-calculator-key' && d.key) {
      press(d.key);
    }
  });

  window.addEventListener('storage', function() { initFromStorage(); });

  document.getElementById('calcGrid').addEventListener('click', function(e) {
    const btn = e.target.closest('[data-calc]');
    if (btn) press(btn.getAttribute('data-calc'));
  });

  function closeCalc() {
    try {
      window.parent.postMessage({ type: 'cb-calculator-close' }, '*');
      window.parent.postMessage({ type: 'cb-close-calculator' }, '*');
    } catch(e) {}
  }
  document.getElementById('closeCalculatorBtn').addEventListener('click', closeCalc);
  document.getElementById('closeCalcTopBtn').addEventListener('click', closeCalc);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeCalc(); return; }
    if (/^[0-9]$/.test(e.key)) { press(e.key); return; }
    if (['+', '-', '*', '/', '%', '.'].includes(e.key)) { press(e.key); return; }
    if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); press('='); return; }
    if (e.key === 'Backspace') { press('DEL'); return; }
  });

  try { window.parent.postMessage({ type: 'cb-calculator-ready' }, '*'); } catch(e) {}
})();
</script>
</body>
</html>
